project:
  type: website
  output-dir: docs          # GitHub Pages sirve desde /docs
  render:
    - index.qmd              # limita el sitio a estas páginas; otros .qmd
    - rubricas.qmd            # (ej. guías de clase como C1_termometro/) no se publican
  resources:
    - lecturas/**            # copia todos los PDF aunque el nombre tenga & o , (bug de detección automática de Pandoc)

website:
  title: "SOL191 · Sociología del Género"
  navbar:
    left:
      - href: index.qmd
        text: Programa
      - href: rubricas.qmd
        text: Rúbricas de evaluación
      # Agrega páginas aquí a medida que crees clases, guías, etc.
      # - href: clases/c01.qmd
      #   text: Clases
  page-footer:
    left: "Tania Hutt · PUC-Chile · 2026"

format:
  html:
    theme: cosmo
    lang: es
    toc: true
    toc-depth: 3
    toc-title: "En esta página"
    smooth-scroll: true
    link-external-icon: true
    link-external-newwindow: true
